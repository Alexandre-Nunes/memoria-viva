
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memória Viva — Foto com vídeo</title>
  <meta name="theme-color" content="#0b1020">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #0b1020;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #17243b 0%, #0b1020 55%, #070a12 100%);
    }

    header {
      padding: 25px 18px 16px;
      text-align: center;
    }

    .brand {
      font-size: clamp(1.9rem, 7vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.15;
      background: linear-gradient(90deg, #ffffff, #8be9fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 9px;
      color: #bdcbe0;
      font-size: 0.95rem;
    }

    .pill {
      display: inline-block;
      margin-top: 13px;
      padding: 7px 13px;
      border: 1px solid #405574;
      border-radius: 999px;
      background: rgba(77, 130, 190, 0.12);
      color: #a9e8ff;
      font-size: 0.78rem;
    }

    .instructions {
      max-width: 620px;
      margin: 0 auto;
      padding: 0 22px 19px;
      color: #dce7f8;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /*
      IMPORTANTE:
      O fundo da área da câmera deve ser transparente.
      Não adicionar fundo sólido nem pseudo-elemento sobre a câmera.
    */
    .stage {
      position: relative;
      isolation: auto;
      width: calc(100% - 24px);
      max-width: 760px;
      height: min(64vh, 620px);
      min-height: 320px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(139, 233, 253, 0.28);
      border-radius: 22px;
      background: transparent !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
    }

    a-scene {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent !important;
    }

    a-scene canvas,
    .a-canvas {
      background: transparent !important;
    }

    .status {
      max-width: 650px;
      min-height: 48px;
      margin: 16px auto 8px;
      padding: 10px 18px;
      color: #a9e8ff;
      text-align: center;
      font-size: 0.94rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .note {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px 28px;
      color: #91a1bb;
      text-align: center;
      font-size: 0.8rem;
      line-height: 1.55;
    }

    @media (max-width: 480px) {
      header {
        padding-top: 22px;
      }

      .instructions {
        padding-right: 20px;
        padding-left: 20px;
        font-size: 0.9rem;
      }

      .stage {
        width: calc(100% - 16px);
        height: 62vh;
        min-height: 300px;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">Memória Viva</div>
    <div class="tagline">Algumas lembranças merecem movimento.</div>
    <div class="pill">Protótipo experimental</div>
  </header>

  <div class="instructions">
    Permita o acesso à câmera e aponte para a foto cadastrada.
    Quando a imagem for reconhecida, o vídeo aparecerá sobre ela.
  </div>

  <div class="stage">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: yes; uiError: yes;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <video
          id="memoryVideo"
          src="./memoria.mp4.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous">
        </video>
      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <a-entity
        mindar-image-target="targetIndex: 0"
        id="photoTarget">

        <a-video
          src="#memoryVideo"
          position="0 0 0"
          width="1"
          height="0.5625">
        </a-video>

      </a-entity>
    </a-scene>
  </div>

  <div class="status" id="status" role="status" aria-live="polite">
    Preparando a câmera…
  </div>

  <div class="note">
    Aponte para a foto cadastrada e mantenha-a visível durante a reprodução.
  </div>

  <script>
    const target = document.querySelector('#photoTarget');
    const video = document.querySelector('#memoryVideo');
    const status = document.querySelector('#status');
    const scene = document.querySelector('a-scene');

    target.addEventListener('targetFound', async () => {
      status.textContent =
        'Foto reconhecida! Reproduzindo sua lembrança…';

      try {
        await video.play();
      } catch (error) {
        status.textContent =
          'Foto reconhecida. Se o celular bloquear a reprodução, toque na tela e tente novamente.';
        console.error('Erro ao iniciar o vídeo:', error);
      }
    });

    target.addEventListener('targetLost', () => {
      status.textContent =
        'Foto fora de visão. Aponte novamente para a foto.';
      video.pause();
    });

    scene.addEventListener('arReady', () => {
      status.textContent =
        'Câmera pronta. Aponte para a foto cadastrada.';
    });

    scene.addEventListener('arError', () => {
      status.textContent =
        'Não foi possível iniciar a câmera. Confira a permissão e abra o site por HTTPS.';
    });
  </script>
</body>
</html>
