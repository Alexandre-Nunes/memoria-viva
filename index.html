
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Memória Viva</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* A câmera precisa continuar visível por trás do canvas 3D. */
    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
    }

    a-scene canvas {
      position: absolute !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    /* Vídeo-fonte: não deve aparecer como elemento visual na página. */
    #memoryVideo {
      position: fixed;
      left: 0;
      top: 0;
      width: 2px;
      height: 2px;
      opacity: 0;
      pointer-events: none;
      border: 0;
    }

    #painel {
      position: fixed;
      z-index: 1000;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      right: 12px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.82);
      color: #fff;
      text-align: center;
    }

    #titulo {
      margin-bottom: 7px;
      font-size: 20px;
      font-weight: bold;
    }

    #status {
      font-size: 14px;
      line-height: 1.4;
    }

    #acoes {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.55;
    }

    #diagnostico {
      display: none;
      margin-top: 10px;
      color: #ffd7d7;
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div id="painel">
    <div id="titulo">Memória Viva</div>
    <div id="status">Iniciando a realidade aumentada...</div>

    <div id="acoes">
      <button id="btnReproduzir">▶ Reproduzir lembrança</button>
      <button id="btnSom" style="display:none">🔊 Ativar som</button>
      <button id="btnTentar" style="display:none">Tentar novamente</button>
    </div>

    <div id="diagnostico"></div>
  </div>

  <!-- Fonte do vídeo fora da cena 3D: não cria uma segunda exibição. -->
  <video
    id="memoryVideo"
    playsinline
    webkit-playsinline
    muted
    loop
    preload="none"
  ></video>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true, antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="alvo"
      mindar-image-target="targetIndex: 0"
    >
      <a-video
        id="videoPlane"
        src="#memoryVideo"
        width="1"
        height="0.5625"
        position="0 0 0.02"
        material="shader: flat; side: double"
        visible="false"
      ></a-video>
    </a-entity>
  </a-scene>

  <script>
    (() => {
      const video = document.getElementById('memoryVideo');
      const alvo = document.getElementById('alvo');
      const plano = document.getElementById('videoPlane');
      const cena = document.querySelector('a-scene');

      const status = document.getElementById('status');
      const acoes = document.getElementById('acoes');
      const diagnostico = document.getElementById('diagnostico');

      const btnReproduzir = document.getElementById('btnReproduzir');
      const btnSom = document.getElementById('btnSom');
      const btnTentar = document.getElementById('btnTentar');

      let alvoVisivel = false;
      let carregando = false;
      let videoPronto = false;

      function informar(mensagem) {
        status.textContent = mensagem;
      }

      function erro(mensagem) {
        diagnostico.textContent = mensagem;
        diagnostico.style.display = 'block';
      }

      function limparErro() {
        diagnostico.textContent = '';
        diagnostico.style.display = 'none';
      }

      function carregarVideo() {
        if (carregando || videoPronto) return;

        carregando = true;
        limparErro();
        informar('Carregando o vídeo...');

        video.src = new URL(
          './memoria.mp4.mp4',
          document.baseURI
        ).href;

        video.load();
      }

      function falhaVideo() {
        carregando = false;
        videoPronto = false;

        if (!alvoVisivel) return;

        informar('Não foi possível carregar o vídeo.');
        erro(
          'Confira se o arquivo memoria.mp4.mp4 existe na raiz do GitHub Pages.'
        );
        btnTentar.style.display = 'block';
      }

      video.addEventListener('canplay', () => {
        carregando = false;
        videoPronto = true;
        btnTentar.style.display = 'none';

        if (alvoVisivel && video.paused) {
          informar('Vídeo pronto! Toque em Reproduzir lembrança.');
        }
      });

      video.addEventListener('error', falhaVideo);

      video.addEventListener('playing', () => {
        if (!alvoVisivel) return;

        limparErro();
        informar('Lembrança reproduzindo!');
        btnReproduzir.textContent = '▶ Reiniciar lembrança';
        btnSom.style.display = video.muted ? 'block' : 'none';
      });

      alvo.addEventListener('targetFound', () => {
        alvoVisivel = true;
        acoes.style.display = 'flex';
        plano.setAttribute('visible', false);
        btnReproduzir.disabled = false;
        btnReproduzir.textContent = '▶ Reproduzir lembrança';

        informar('Foto reconhecida! Preparando o vídeo.');
        carregarVideo();
      });

      alvo.addEventListener('targetLost', () => {
        alvoVisivel = false;
        acoes.style.display = 'none';
        plano.setAttribute('visible', false);
        btnSom.style.display = 'none';

        video.pause();

        informar('Foto fora de visão. Aponte novamente para a foto.');
      });

      function esperarVideo() {
        if (video.readyState >= 3) return Promise.resolve();

        return new Promise((resolve, reject) => {
          let finalizado = false;

          const concluir = (funcao, valor) => {
            if (finalizado) return;
            finalizado = true;
            clearTimeout(temporizador);
            video.removeEventListener('canplay', pronto);
            video.removeEventListener('error', falhou);
            funcao(valor);
          };

          const pronto = () => concluir(resolve);
          const falhou = () => concluir(
            reject,
            new Error('Falha ao carregar ou decodificar o vídeo.')
          );

          const temporizador = setTimeout(() => {
            concluir(
              reject,
              new Error('O vídeo demorou para carregar. Tente novamente.')
            );
          }, 20000);

          video.addEventListener('canplay', pronto);
          video.addEventListener('error', falhou);

          if (video.readyState >= 3) pronto();
        });
      }

      async function reproduzir() {
        if (!alvoVisivel) {
          informar('Aponte a câmera para a foto primeiro.');
          return;
        }

        btnReproduzir.disabled = true;
        limparErro();

        try {
          carregarVideo();

          if (video.readyState < 3) {
            informar('Aguardando o vídeo carregar...');
            await esperarVideo();
          }

          if (!alvoVisivel) return;

          video.muted = true;
          await video.play();

          // Exibe a superfície 3D somente após iniciar a reprodução.
          plano.setAttribute('visible', true);

          btnSom.style.display = 'block';
          btnTentar.style.display = 'none';
          informar('Lembrança reproduzindo!');

        } catch (e) {
          plano.setAttribute('visible', false);
          informar('Não foi possível reproduzir o vídeo.');
          erro(e.message || 'Verifique o arquivo e tente novamente.');
          btnTentar.style.display = 'block';
        } finally {
          btnReproduzir.disabled = false;
        }
      }

      btnReproduzir.addEventListener('click', async () => {
        if (!alvoVisivel) {
          informar('Aponte a câmera para a foto primeiro.');
          return;
        }

        if (!video.paused && !video.ended) {
          video.currentTime = 0;
          return;
        }

        await reproduzir();
      });

      btnSom.addEventListener('click', async () => {
        try {
          video.muted = false;
          await video.play();
          btnSom.style.display = 'none';
          informar('Lembrança reproduzindo com som!');
        } catch (e) {
          video.muted = true;
          informar('Não foi possível ativar o som.');
          erro('Toque novamente para tentar ativar o áudio.');
        }
      });

      btnTentar.addEventListener('click', async () => {
        limparErro();
        video.pause();
        video.removeAttribute('src');
        video.load();

        carregando = false;
        videoPronto = false;

        carregarVideo();

        if (alvoVisivel) {
          try {
            await esperarVideo();
          } catch (e) {
            falhaVideo();
          }
        }
      });

      cena.addEventListener('loaded', () => {
        informar('Inicializando câmera. Permita o acesso se solicitado.');
      });

      cena.addEventListener('arReady', () => {
        informar('Câmera pronta. Aponte para a foto do fotolivro.');
      });

      cena.addEventListener('arError', () => {
        informar('Não foi possível iniciar a câmera.');
        erro('Confira a permissão da câmera no navegador e tente novamente.');
      });
    })();
  </script>

</body>
</html>
