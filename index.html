
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memória Viva — Foto com vídeo</title>
  <meta name="theme-color" content="#171717">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      background: transparent !important;
    }

    body {
      overflow-x: hidden;
    }

    header {
      position: relative;
      z-index: 3;
      padding: 18px 20px 12px;
      text-align: center;
      background: rgba(17, 17, 17, 0.82);
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .tagline {
      color: #c9c9c9;
      font-size: .92rem;
      margin-top: 5px;
    }

    .instructions {
      position: relative;
      z-index: 3;
      max-width: 650px;
      margin: 0 auto;
      padding: 12px 18px 14px;
      text-align: center;
      color: #e4e4e4;
      line-height: 1.45;
      background: rgba(17, 17, 17, 0.82);
    }

    .pill {
      display: inline-block;
      margin-top: 10px;
      border: 1px solid #777;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: .78rem;
      color: #ddd;
    }

    /* A área de AR não deve pintar um fundo sobre a câmera */
    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 66vh;
      min-height: 330px;
      max-height: 650px;
      overflow: hidden;
      background: transparent !important;
    }

    .stage a-scene {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    .stage canvas,
    .stage .a-canvas {
      background: transparent !important;
    }

    /*
      O vídeo da câmera criado pelo MindAR pode ser inserido
      diretamente no body. Não confundir com o vídeo da lembrança,
      que fica dentro de a-assets.
    */
    body > video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    .status {
      position: relative;
      z-index: 3;
      margin: 12px auto;
      padding: 10px 18px;
      text-align: center;
      font-size: .92rem;
      color: #fff;
      background: rgba(17, 17, 17, 0.88);
    }

    #playButton {
      display: none;
      position: relative;
      z-index: 4;
      margin: 12px auto;
      padding: 13px 20px;
      border: 0;
      border-radius: 12px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    .note {
      position: relative;
      z-index: 3;
      margin: 0 auto;
      padding: 0 18px 24px;
      color: #aaa;
      font-size: .78rem;
      text-align: center;
      background: rgba(17, 17, 17, 0.88);
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">Memória Viva</div>
    <div class="tagline">Algumas lembranças merecem movimento.</div>
    <div class="pill">Protótipo experimental</div>
  </header>

  <div class="instructions">
    Permita o acesso à câmera e aponte para a foto cadastrada.
    Quando a imagem for reconhecida, o vídeo será exibido sobre ela.
  </div>

  <div class="stage">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: yes; uiError: yes;"
      embedded
      color-space="sRGB"
      renderer="alpha: true, colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <video
          id="memoryVideo"
          src="./memoria.mp4.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous">
        </video>
      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <a-entity
        mindar-image-target="targetIndex: 0"
        id="photoTarget">

        <a-video
          src="#memoryVideo"
          position="0 0 0"
          width="1"
          height="0.5625"
          material="shader: flat; side: double">
        </a-video>

      </a-entity>
    </a-scene>
  </div>

  <div class="status" id="status">
    Preparando a câmera…
  </div>

  <button id="playButton" type="button">
    ▶ Reproduzir lembrança com som
  </button>

  <div class="note">
    Aponte a câmera para a foto cadastrada para visualizar a lembrança.
  </div>

  <script>
    const target = document.querySelector('#photoTarget');
    const video = document.querySelector('#memoryVideo');
    const status = document.querySelector('#status');
    const playButton = document.querySelector('#playButton');
    const scene = document.querySelector('a-scene');

    let targetVisible = false;

    video.muted = false;
    video.volume = 1;
    video.playsInline = true;

    async function playMemory() {
      try {
        await video.play();
        playButton.style.display = 'none';
        status.textContent = 'Foto reconhecida! Reproduzindo sua lembrança…';
      } catch (error) {
        playButton.style.display = 'block';
        status.textContent =
          'Foto reconhecida. Toque no botão para reproduzir o vídeo com som.';
        console.error('Não foi possível iniciar o vídeo:', error);
      }
    }

    target.addEventListener('targetFound', () => {
      targetVisible = true;
      status.textContent = 'Foto reconhecida! Reproduzindo sua lembrança…';
      playMemory();
    });

    playButton.addEventListener('click', () => {
      if (targetVisible) {
        playMemory();
      }
    });

    target.addEventListener('targetLost', () => {
      targetVisible = false;
      video.pause();
      playButton.style.display = 'none';
      status.textContent = 'Foto fora de visão. Aponte novamente para a foto.';
    });

    scene.addEventListener('arReady', () => {
      status.textContent = 'Câmera pronta. Aponte para a foto cadastrada.';
    });

    scene.addEventListener('arError', () => {
      status.textContent =
        'Não foi possível iniciar a câmera. Confira a permissão do Safari.';
    });
  </script>
</body>
</html>
