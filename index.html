
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memória Viva — Foto com vídeo</title>
  <meta name="theme-color" content="#171717">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: transparent;
      color: #fff;
    }

    /*
      A cena ocupa a tela inteira.
      Não usar contêiner .stage nem reposicionar manualmente
      o vídeo da câmera criado pelo MindAR.
    */
    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 0;
    }

    header, .instructions, .controls, .note {
      position: relative;
      z-index: 10;
      text-align: center;
      background: rgba(17, 17, 17, 0.78);
    }

    header {
      padding: 18px 20px 12px;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .tagline {
      color: #ddd;
      font-size: .92rem;
      margin-top: 5px;
    }

    .pill {
      display: inline-block;
      margin-top: 10px;
      border: 1px solid #777;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: .78rem;
      color: #ddd;
    }

    .instructions {
      padding: 10px 18px 14px;
      line-height: 1.45;
      color: #f0f0f0;
    }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px calc(18px + env(safe-area-inset-bottom));
    }

    .status {
      margin: 0 auto 10px;
      max-width: 650px;
      font-size: .92rem;
      line-height: 1.4;
      color: #fff;
    }

    #playButton {
      display: none;
      margin: 0 auto;
      padding: 14px 20px;
      border: 0;
      border-radius: 12px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    .note {
      padding: 10px 18px;
      color: #ccc;
      font-size: .78rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">Memória Viva</div>
    <div class="tagline">Algumas lembranças merecem movimento.</div>
    <div class="pill">Protótipo experimental</div>
  </header>

  <div class="instructions">
    Permita o acesso à câmera e aponte para a foto cadastrada.
    O vídeo será exibido sobre a foto reconhecida.
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: yes; uiError: yes;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="memoryVideo"
        src="./memoria.mp4.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="photoTarget"
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#memoryVideo"
        position="0 0 0.01"
        width="1"
        height="0.5625"
        material="shader: flat; side: double">
      </a-video>

    </a-entity>
  </a-scene>

  <div class="controls">
    <div class="status" id="status">
      Preparando a câmera…
    </div>

    <button id="playButton" type="button">
      ▶ Reproduzir lembrança com som
    </button>

    <div class="note">
      Aponte para a foto cadastrada para visualizar a lembrança.
    </div>
  </div>

  <script>
    const target = document.querySelector('#photoTarget');
    const video = document.querySelector('#memoryVideo');
    const status = document.querySelector('#status');
    const playButton = document.querySelector('#playButton');
    const scene = document.querySelector('a-scene');

    let targetVisible = false;

    video.muted = false;
    video.volume = 1;

    async function playMemory() {
      try {
        await video.play();
        playButton.style.display = 'none';
        status.textContent =
          'Foto reconhecida! Reproduzindo sua lembrança…';
      } catch (error) {
        playButton.style.display = 'block';
        status.textContent =
          'Foto reconhecida. Toque no botão para iniciar o vídeo com som.';
        console.error('Erro ao reproduzir vídeo:', error);
      }
    }

    target.addEventListener('targetFound', () => {
      targetVisible = true;
      status.textContent = 'Foto reconhecida!';
      playMemory();
    });

    playButton.addEventListener('click', () => {
      if (targetVisible) {
        playMemory();
      }
    });

    target.addEventListener('targetLost', () => {
      targetVisible = false;
      video.pause();
      playButton.style.display = 'none';
      status.textContent =
        'Foto fora de visão. Aponte novamente para a foto.';
    });

    scene.addEventListener('arReady', () => {
      status.textContent =
        'Câmera pronta. Aponte para a foto cadastrada.';
    });

    scene.addEventListener('arError', () => {
      status.textContent =
        'Não foi possível iniciar a câmera. Verifique a permissão do Safari.';
    });
  </script>
</body>
</html>
