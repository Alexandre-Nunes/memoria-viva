
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>Memória Viva</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      z-index: 0;
    }

    a-scene canvas {
      background: transparent !important;
    }

    #memoryVideo {
      position: fixed;
      left: 0;
      top: 0;
      width: 2px;
      height: 2px;
      opacity: 0;
      pointer-events: none;
      border: 0;
    }

    #telaInicial {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #101820, #253746);
      color: #fff;
      text-align: center;
    }

    .conteudoInicial {
      width: 100%;
      max-width: 360px;
    }

    .simbolo {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(216, 181, 138, 0.6);
      border-radius: 50%;
      color: #d8b58a;
      font-size: 34px;
    }

    #tituloInicial {
      margin: 0 0 14px;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: 0.2px;
    }

    #textoInicial {
      margin: 0 auto 30px;
      max-width: 300px;
      color: #d9e0e5;
      font-size: 16px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      min-height: 52px;
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      background: #d8b58a;
      color: #182029;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #dicaInicial {
      margin-top: 18px;
      color: #b8c4cd;
      font-size: 12px;
      line-height: 1.5;
    }

    #painel {
      position: fixed;
      z-index: 1000;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      left: 14px;
      right: 14px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      background: rgba(16, 24, 32, 0.84);
      color: #fff;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    #titulo {
      margin-bottom: 6px;
      font-size: 21px;
      font-weight: 700;
    }

    #status {
      font-size: 14px;
      line-height: 1.5;
      color: #e0e5e9;
    }

    #acoes {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    #btnTentar {
      display: none;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    #diagnostico {
      display: none;
      margin-top: 10px;
      color: #ffd7d7;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    @media (max-width: 360px) {
      #tituloInicial { font-size: 28px; }
      #textoInicial { font-size: 15px; }
      #painel { left: 10px; right: 10px; }
    }
  </style>
</head>

<body>
  <div id="telaInicial">
    <div class="conteudoInicial">
      <div class="simbolo" aria-hidden="true">♡</div>
      <h1 id="tituloInicial">Memória Viva</h1>
      <p id="textoInicial">
        Uma lembrança especial está esperando por você.
      </p>

      <button id="btnAbrirCamera">
        Abrir câmera e encontrar minha lembrança
      </button>

      <div id="dicaInicial">
        Permita o acesso à câmera e aponte para a foto.
      </div>
    </div>
  </div>

  <div id="painel" style="display:none">
    <div id="titulo">Memória Viva</div>
    <div id="status">Preparando a câmera...</div>

    <div id="acoes">
      <button id="btnReproduzir">▶ Reproduzir lembrança</button>
      <button id="btnTentar">Tentar novamente</button>
    </div>

    <div id="diagnostico"></div>
  </div>

  <video
    id="memoryVideo"
    playsinline
    webkit-playsinline
    loop
    preload="auto"
    crossorigin="anonymous"
  ></video>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true, antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="alvo"
      mindar-image-target="targetIndex: 0"
    >
      <a-video
        id="videoPlane"
        width="1"
        height="0.5625"
        position="0 0 0.02"
        material="shader: flat; side: double; transparent: false"
        visible="false"
      ></a-video>
    </a-entity>
  </a-scene>

  <script>
    (() => {
      const video = document.getElementById('memoryVideo');
      const alvo = document.getElementById('alvo');
      const plano = document.getElementById('videoPlane');
      const cena = document.querySelector('a-scene');

      const telaInicial = document.getElementById('telaInicial');
      const btnAbrirCamera = document.getElementById('btnAbrirCamera');
      const painel = document.getElementById('painel');
      const status = document.getElementById('status');
      const acoes = document.getElementById('acoes');
      const diagnostico = document.getElementById('diagnostico');
      const btnReproduzir = document.getElementById('btnReproduzir');
      const btnTentar = document.getElementById('btnTentar');

      let cameraIniciada = false;
      let alvoVisivel = false;
      let carregando = false;
      let videoPronto = false;
      let tentandoReproduzir = false;
      let tentativaAutomaticaFeita = false;

      function informar(mensagem) {
        status.textContent = mensagem;
      }

      function mostrarErro(mensagem) {
        diagnostico.textContent = mensagem;
        diagnostico.style.display = 'block';
      }

      function limparErro() {
        diagnostico.textContent = '';
        diagnostico.style.display = 'none';
      }

      function carregarVideo() {
        if (carregando || videoPronto) return;

        carregando = true;
        limparErro();
        informar('Preparando sua lembrança...');

        video.src = new URL('./memoria.mp4.mp4', document.baseURI).href;
        video.load();
      }

      function atualizarTextura() {
        if (
          !plano.components.material ||
          !plano.components.material.material ||
          video.videoWidth <= 0 ||
          video.readyState < 2
        ) {
          return;
        }

        const material = plano.components.material.material;

        if (material.map) {
          material.map.needsUpdate = true;
        } else {
          plano.setAttribute('material', {
            shader: 'flat',
            src: '#memoryVideo',
            side: 'double'
          });
        }
      }

      async function iniciarCamera() {
        if (cameraIniciada) return;

        btnAbrirCamera.disabled = true;
        btnAbrirCamera.textContent = 'Abrindo câmera...';

        try {
          const sistema = cena.systems['mindar-image-system'];

          if (!sistema) {
            throw new Error('O sistema de realidade aumentada não foi inicializado.');
          }

          await sistema.start();

          cameraIniciada = true;
          telaInicial.style.display = 'none';
          painel.style.display = 'block';
          informar('Câmera ativa. Aponte para a foto.');
        } catch (erro) {
          telaInicial.style.display = 'flex';
          btnAbrirCamera.disabled = false;
          btnAbrirCamera.textContent = 'Tentar abrir a câmera';

          const mensagem = erro.name === 'NotAllowedError'
            ? 'O acesso à câmera foi negado. Permita o uso da câmera nas configurações do navegador.'
            : 'Não foi possível abrir a câmera. Verifique a permissão e tente novamente.';

          document.getElementById('textoInicial').textContent = mensagem;
          document.getElementById('dicaInicial').textContent =
            'A página precisa de uma conexão segura (HTTPS) e permissão para usar a câmera.';
        }
      }

      async function tentarReproducaoAutomatica() {
        if (
          !alvoVisivel ||
          !videoPronto ||
          !video.paused ||
          tentandoReproduzir ||
          tentativaAutomaticaFeita
        ) {
          return;
        }

        tentativaAutomaticaFeita = true;
        tentandoReproduzir = true;

        try {
          video.muted = false;
          await video.play();

          if (!alvoVisivel) {
            video.pause();
            return;
          }

          atualizarTextura();
          plano.setAttribute('visible', true);
        } catch (erro) {
          if (!alvoVisivel) return;

          painel.style.display = 'block';
          informar('Foto reconhecida! Toque para iniciar sua lembrança.');
          acoes.style.display = 'flex';
          btnReproduzir.style.display = 'block';
          btnReproduzir.disabled = false;
        } finally {
          tentandoReproduzir = false;
        }
      }

      video.addEventListener('loadeddata', () => {
        carregando = false;
        videoPronto = video.videoWidth > 0;
        atualizarTextura();

        if (alvoVisivel && videoPronto) {
          tentarReproducaoAutomatica();
        }
      });

      video.addEventListener('canplay', () => {
        carregando = false;
        videoPronto = video.videoWidth > 0;
        atualizarTextura();

        if (alvoVisivel && videoPronto) {
          tentarReproducaoAutomatica();
        }
      });

      video.addEventListener('playing', () => {
        atualizarTextura();

        if (alvoVisivel) {
          plano.setAttribute('visible', true);
          painel.style.display = 'none';
          limparErro();
        }
      });

      video.addEventListener('error', () => {
        carregando = false;
        videoPronto = false;

        if (!alvoVisivel) return;

        painel.style.display = 'block';
        informar('Não foi possível carregar o vídeo.');
        mostrarErro(
          'Confira se memoria.mp4.mp4 está na raiz do GitHub Pages e se o vídeo abre no navegador.'
        );

        acoes.style.display = 'flex';
        btnReproduzir.style.display = 'none';
        btnTentar.style.display = 'block';
      });

      alvo.addEventListener('targetFound', () => {
        alvoVisivel = true;
        tentativaAutomaticaFeita = false;

        painel.style.display = 'block';
        limparErro();
        acoes.style.display = 'none';
        btnReproduzir.style.display = 'block';
        btnReproduzir.disabled = false;
        btnReproduzir.textContent = '▶ Reproduzir lembrança';
        btnTentar.style.display = 'none';

        plano.setAttribute('visible', false);
        informar('Foto reconhecida! Preparando sua lembrança...');

        carregarVideo();

        if (videoPronto) {
          tentarReproducaoAutomatica();
        }
      });

      alvo.addEventListener('targetLost', () => {
        alvoVisivel = false;
        tentativaAutomaticaFeita = false;

        plano.setAttribute('visible', false);
        video.pause();

        painel.style.display = 'block';
        acoes.style.display = 'none';
        informar('Aponte a câmera novamente para a foto.');
      });

      function esperarVideo() {
        if (video.readyState >= 2 && video.videoWidth > 0) {
          return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
          let finalizado = false;

          const temporizador = setTimeout(() => {
            concluir(
              reject,
              new Error('O vídeo demorou para carregar. Tente novamente.')
            );
          }, 20000);

          function limpar() {
            clearTimeout(temporizador);
            video.removeEventListener('loadeddata', pronto);
            video.removeEventListener('canplay', pronto);
            video.removeEventListener('error', falhou);
          }

          function concluir(funcao, valor) {
            if (finalizado) return;
            finalizado = true;
            limpar();
            funcao(valor);
          }

          function pronto() {
            if (video.videoWidth > 0 && video.readyState >= 2) {
              concluir(resolve);
            }
          }

          function falhou() {
            concluir(
              reject,
              new Error('O navegador não conseguiu carregar o vídeo.')
            );
          }

          video.addEventListener('loadeddata', pronto);
          video.addEventListener('canplay', pronto);
          video.addEventListener('error', falhou);
          pronto();
        });
      }

      async function reproduzir() {
        if (!alvoVisivel) return;

        btnReproduzir.disabled = true;
        limparErro();

        try {
          carregarVideo();

          if (video.readyState < 2 || video.videoWidth === 0) {
            informar('Aguardando o vídeo carregar...');
            await esperarVideo();
          }

          if (!alvoVisivel) return;

          video.muted = false;
          await video.play();

          atualizarTextura();
          plano.setAttribute('visible', true);
        } catch (erro) {
          painel.style.display = 'block';
          informar('Não foi possível iniciar o vídeo.');
          mostrarErro(
            'Verifique a conexão e tente novamente. Alguns navegadores exigem um toque para permitir o áudio.'
          );
          acoes.style.display = 'flex';
          btnTentar.style.display = 'block';
        } finally {
          btnReproduzir.disabled = false;
        }
      }

      btnAbrirCamera.addEventListener('click', iniciarCamera);

      btnReproduzir.addEventListener('click', async () => {
        if (!alvoVisivel) return;

        if (!video.paused && !video.ended) {
          video.currentTime = 0;
          return;
        }

        tentativaAutomaticaFeita = true;
        await reproduzir();
      });

      btnTentar.addEventListener('click', async () => {
        limparErro();
        video.pause();
        video.removeAttribute('src');
        video.load();

        carregando = false;
        videoPronto = false;
        tentativaAutomaticaFeita = false;

        btnTentar.style.display = 'none';
        btnReproduzir.style.display = 'block';
        btnReproduzir.disabled = false;

        carregarVideo();

        try {
          await esperarVideo();

          if (alvoVisivel) {
            videoPronto = true;
            tentativaAutomaticaFeita = false;
            await tentarReproducaoAutomatica();

            if (video.paused) {
              painel.style.display = 'block';
              informar('Vídeo pronto! Toque para reproduzir.');
              acoes.style.display = 'flex';
            }
          }
        } catch (erro) {
          painel.style.display = 'block';
          informar('Falha ao carregar o vídeo.');
          mostrarErro(erro.message);
          acoes.style.display = 'flex';
          btnTentar.style.display = 'block';
        }
      });

      cena.addEventListener('arReady', () => {
        if (cameraIniciada && !alvoVisivel) {
          informar('Câmera pronta. Aponte para a foto.');
        }
      });

      cena.addEventListener('arError', () => {
        painel.style.display = 'block';
        informar('Não foi possível iniciar a câmera.');
        mostrarErro('Confira a permissão da câmera no navegador.');
      });
    })();
  </script>
</body>
</html>
