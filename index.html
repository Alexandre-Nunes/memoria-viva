
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Memória Viva</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101010;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    #topbar {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      right: 0;
      padding: max(18px, env(safe-area-inset-top)) 16px 18px;
      text-align: center;
      background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
      pointer-events: none;
    }

    #topbar h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    #topbar p {
      margin: 0;
      font-size: 14px;
    }

    #status {
      position: fixed;
      z-index: 20;
      left: 16px;
      right: 16px;
      bottom: max(20px, env(safe-area-inset-bottom));
      padding: 13px 15px;
      border-radius: 12px;
      background: rgba(0,0,0,.82);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
    }

    #startMessage {
      position: fixed;
      z-index: 12;
      top: 50%;
      left: 50%;
      width: calc(100% - 40px);
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
      text-shadow: 0 1px 5px black;
      pointer-events: none;
    }

    #startMessage.hidden {
      display: none;
    }

    #playButton {
      display: none;
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: max(90px, calc(env(safe-area-inset-bottom) + 90px));
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 15px 22px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    #playButton.visible {
      display: block;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    a-scene canvas {
      background: transparent !important;
    }
  </style>
</head>

<body>
  <header id="topbar">
    <h1>Memória Viva</h1>
    <p>Aponte a câmera para a foto e reviva esse momento.</p>
  </header>

  <div id="startMessage">
    Permita o acesso à câmera e aponte para a foto cadastrada.
  </div>

  <div id="status" role="status" aria-live="polite">
    Preparando a câmera...
  </div>

  <button id="playButton" type="button">
    ▶ Reproduzir lembrança
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets timeout="20000">
      <video
        id="memoryVideo"
        src="./memoria.mp4.mp4"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
        loop
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-entity id="imageTarget" mindar-image-target="targetIndex: 0">
      <a-video
        id="videoPlane"
        src="#memoryVideo"
        width="1"
        height="0.5625"
        position="0 0 0.01"
        material="shader: flat"
      ></a-video>
    </a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>
  </a-scene>

  <script>
    (() => {
      const scene = document.querySelector("a-scene");
      const target = document.querySelector("#imageTarget");
      const video = document.querySelector("#memoryVideo");
      const plane = document.querySelector("#videoPlane");
      const status = document.querySelector("#status");
      const button = document.querySelector("#playButton");
      const startMessage = document.querySelector("#startMessage");

      let targetVisible = false;
      let isPlaying = false;

      function setStatus(text) {
        status.textContent = text;
      }

      function showPlayButton(show) {
        button.classList.toggle("visible", show);
      }

      function adjustVideoSize() {
        if (!video.videoWidth || !video.videoHeight) return;

        const ratio = video.videoHeight / video.videoWidth;
        plane.setAttribute("width", 1);
        plane.setAttribute("height", ratio);
      }

      video.addEventListener("loadedmetadata", adjustVideoSize);
      video.addEventListener("loadeddata", adjustVideoSize);

      video.addEventListener("playing", () => {
        isPlaying = true;

        if (targetVisible) {
          setStatus("Vídeo reproduzindo! Toque na tela para ativar o som.");
          button.textContent = "🔊 Ativar som";
          showPlayButton(true);
        }
      });

      video.addEventListener("error", () => {
        const errorCode = video.error ? video.error.code : 0;

        console.error("Erro no vídeo:", video.error);
        console.error("Endereço:", video.currentSrc);

        setStatus(
          "Erro ao carregar o vídeo (código " + errorCode +
          "). Verifique a conexão e o arquivo."
        );

        showPlayButton(true);
        button.textContent = "↻ Tentar novamente";
      });

      target.addEventListener("targetFound", () => {
        targetVisible = true;
        startMessage.classList.add("hidden");

        setStatus("Foto reconhecida! Toque em Reproduzir lembrança.");

        button.textContent = isPlaying
          ? "🔊 Ativar som"
          : "▶ Reproduzir lembrança";

        showPlayButton(true);
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;
        video.pause();
        isPlaying = false;

        showPlayButton(false);
        startMessage.classList.remove("hidden");

        setStatus("Foto fora de visão. Aponte novamente para a foto.");
      });

      /*
       * IMPORTANTE:
       * video.play() é chamado diretamente no toque do usuário,
       * sem aguardar outra operação antes dele.
       * Isso ajuda a atender às restrições de reprodução do Safari.
       */
      button.addEventListener("click", () => {
        if (!targetVisible) {
          setStatus("Aponte a câmera para a foto primeiro.");
          return;
        }

        if (isPlaying && video.muted) {
          video.muted = false;

          setStatus("Tentando ativar o som...");

          if (video.paused) {
            const retry = video.play();

            if (retry && typeof retry.catch === "function") {
              retry.catch((error) => {
                console.error("Erro ao ativar o som:", error);
                video.muted = true;
                setStatus("O Safari bloqueou o som. Toque para tentar novamente.");
              });
            }
          } else {
            setStatus("Som ativado.");
          }

          button.textContent = "🔊 Som ativado";
          return;
        }

        video.muted = true;
        video.playsInline = true;
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");

        setStatus("Iniciando reprodução...");

        // A chamada ocorre imediatamente durante o clique.
        const playRequest = video.play();

        if (playRequest && typeof playRequest.then === "function") {
          playRequest.then(() => {
            isPlaying = true;
            setStatus("Vídeo reproduzindo sem som.");

            button.textContent = "🔊 Ativar som";
            showPlayButton(true);
          }).catch((error) => {
            console.error("Falha ao reproduzir:", error);

            isPlaying = false;
            setStatus(
              "O Safari não iniciou o vídeo. Verifique a conexão e tente novamente."
            );

            button.textContent = "↻ Tentar reproduzir";
            showPlayButton(true);
          });
        }
      });

      scene.addEventListener("arReady", () => {
        setStatus("Câmera pronta! Aponte para a foto cadastrada.");
      });

      scene.addEventListener("arError", (event) => {
        console.error("Erro na realidade aumentada:", event);
        setStatus("Não foi possível iniciar a câmera. Confira a permissão do Safari.");
      });
    })();
  </script>
</body>
</html>
