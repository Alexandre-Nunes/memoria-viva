
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>Memória Viva</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      z-index: 0;
    }

    a-scene canvas {
      background: transparent !important;
    }

    body > video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    #memoryVideo {
      position: fixed;
      left: 0;
      top: 0;
      width: 2px;
      height: 2px;
      opacity: 0;
      pointer-events: none;
      border: 0;
    }

    #painel {
      position: fixed;
      z-index: 1000;
      top: calc(env(safe-area-inset-top, 0px) + 18px);
      left: 16px;
      right: 16px;
      padding: 20px 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      background: rgba(16, 24, 32, 0.82);
      color: #fff;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      transition: opacity 0.25s ease;
    }

    #titulo {
      margin-bottom: 8px;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    #status {
      font-size: 14px;
      line-height: 1.5;
      color: #e0e5e9;
    }

    #acoes {
      display: none;
      flex-direction: column;
      gap: 9px;
      margin-top: 16px;
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      background: #d8b58a;
      color: #182029;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #btnTentar {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    #diagnostico {
      display: none;
      margin-top: 12px;
      color: #ffd7d7;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    @media (max-width: 360px) {
      #painel {
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        left: 12px;
        right: 12px;
        padding: 16px 14px;
        border-radius: 16px;
      }

      #titulo {
        font-size: 22px;
      }

      #status {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div id="painel">
    <div id="titulo">Memória Viva</div>
    <div id="status">Uma lembrança especial está esperando por você.<br>Aponte a câmera para a foto.</div>

    <div id="acoes">
      <button id="btnReproduzir">▶ Reproduzir lembrança</button>
      <button id="btnTentar" style="display:none">Tentar novamente</button>
    </div>

    <div id="diagnostico"></div>
  </div>

  <video
    id="memoryVideo"
    playsinline
    webkit-playsinline
    loop
    preload="auto"
    crossorigin="anonymous"
  ></video>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true, antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="alvo"
      mindar-image-target="targetIndex: 0"
    >
      <a-video
        id="videoPlane"
        width="1"
        height="0.5625"
        position="0 0 0.02"
        material="shader: flat; side: double; transparent: false"
        visible="false"
      ></a-video>
    </a-entity>
  </a-scene>

  <script>
    (() => {
      const video = document.getElementById('memoryVideo');
      const alvo = document.getElementById('alvo');
      const plano = document.getElementById('videoPlane');
      const cena = document.querySelector('a-scene');
      const painel = document.getElementById('painel');

      const status = document.getElementById('status');
      const acoes = document.getElementById('acoes');
      const diagnostico = document.getElementById('diagnostico');

      const btnReproduzir = document.getElementById('btnReproduzir');
      const btnTentar = document.getElementById('btnTentar');

      let alvoVisivel = false;
      let carregando = false;
      let videoPronto = false;
      let autoPlayEmAndamento = false;
      let autoPlayTentado = false;

      function informar(mensagem) {
        status.textContent = mensagem;
      }

      function mostrarErro(mensagem) {
        diagnostico.textContent = mensagem;
        diagnostico.style.display = 'block';
      }

      function limparErro() {
        diagnostico.textContent = '';
        diagnostico.style.display = 'none';
      }

      function mostrarPainel() {
        painel.style.display = 'block';
      }

      function carregarVideo() {
        if (carregando || videoPronto) return;

        carregando = true;
        limparErro();
        informar('Preparando sua lembrança...');

        video.src = new URL('./memoria.mp4.mp4', document.baseURI).href;
        video.load();
      }

      function atualizarTextura() {
        if (
          !plano.components.material ||
          !plano.components.material.material ||
          video.videoWidth <= 0 ||
          video.readyState < 2
        ) {
          return;
        }

        const material = plano.components.material.material;

        if (material.map) {
          material.map.needsUpdate = true;
        } else {
          plano.setAttribute('material', {
            shader: 'flat',
            src: '#memoryVideo',
            side: 'double'
          });
        }
      }

      async function tentarReproducaoAutomatica() {
        if (
          !alvoVisivel ||
          !videoPronto ||
          !video.paused ||
          autoPlayTentado ||
          autoPlayEmAndamento
        ) {
          return;
        }

        autoPlayTentado = true;
        autoPlayEmAndamento = true;
        limparErro();

        try {
          video.muted = false;
          await video.play();

          if (!alvoVisivel) {
            video.pause();
            return;
          }

          atualizarTextura();
          plano.setAttribute('visible', true);

          btnReproduzir.textContent = '▶ Reiniciar lembrança';
          informar('Lembrança reproduzindo!');
          acoes.style.display = 'none';
          limparErro();

        } catch (e) {
          if (!alvoVisivel) return;

          mostrarPainel();
          informar('Foto reconhecida! Toque para iniciar a lembrança.');
          acoes.style.display = 'flex';
          btnReproduzir.style.display = 'block';
          btnReproduzir.disabled = false;
          btnReproduzir.textContent = '▶ Reproduzir lembrança';

        } finally {
          autoPlayEmAndamento = false;
        }
      }

      video.addEventListener('loadeddata', () => {
        carregando = false;
        videoPronto = video.videoWidth > 0;
        atualizarTextura();

        if (alvoVisivel && videoPronto) {
          tentarReproducaoAutomatica();
        }
      });

      video.addEventListener('canplay', () => {
        carregando = false;
        videoPronto = video.videoWidth > 0;
        atualizarTextura();

        if (alvoVisivel && videoPronto) {
          tentarReproducaoAutomatica();
        }
      });

      video.addEventListener('error', () => {
        carregando = false;
        videoPronto = false;

        if (!alvoVisivel) return;

        mostrarPainel();
        informar('Não foi possível carregar o vídeo.');
        mostrarErro(
          'Confira se memoria.mp4.mp4 está na raiz do GitHub Pages e se o vídeo abre no navegador.'
        );

        acoes.style.display = 'flex';
        btnReproduzir.style.display = 'none';
        btnTentar.style.display = 'block';
      });

      video.addEventListener('playing', () => {
        atualizarTextura();

        if (alvoVisivel) {
          limparErro();
          plano.setAttribute('visible', true);
          btnReproduzir.textContent = '▶ Reiniciar lembrança';

          // Esconde o painel para deixar a lembrança em destaque.
          painel.style.display = 'none';
        }
      });

      alvo.addEventListener('targetFound', () => {
        alvoVisivel = true;
        autoPlayTentado = false;

        mostrarPainel();
        limparErro();

        acoes.style.display = 'none';
        btnReproduzir.style.display = 'block';
        btnReproduzir.disabled = false;
        btnReproduzir.textContent = '▶ Reproduzir lembrança';
        btnTentar.style.display = 'none';

        plano.setAttribute('visible', false);
        informar('Foto reconhecida! Preparando sua lembrança...');

        carregarVideo();

        // Se o vídeo já estiver carregado, tenta reproduzir imediatamente.
        tentarReproducaoAutomatica();
      });

      alvo.addEventListener('targetLost', () => {
        alvoVisivel = false;
        autoPlayTentado = false;

        mostrarPainel();
        acoes.style.display = 'none';
        plano.setAttribute('visible', false);
        video.pause();

        informar('Uma lembrança especial está esperando por você.\nAponte a câmera para a foto.');
      });

      function esperarVideo() {
        if (video.readyState >= 2 && video.videoWidth > 0) {
          return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
          let finalizado = false;

          const temporizador = setTimeout(() => {
            concluir(
              reject,
              new Error('O vídeo demorou para carregar. Tente novamente.')
            );
          }, 20000);

          function limpar() {
            clearTimeout(temporizador);
            video.removeEventListener('loadeddata', pronto);
            video.removeEventListener('canplay', pronto);
            video.removeEventListener('error', falhou);
          }

          function concluir(funcao, valor) {
            if (finalizado) return;
            finalizado = true;
            limpar();
            funcao(valor);
          }

          function pronto() {
            if (video.videoWidth > 0 && video.readyState >= 2) {
              concluir(resolve);
            }
          }

          function falhou() {
            concluir(
              reject,
              new Error('O navegador não conseguiu carregar o vídeo.')
            );
          }

          video.addEventListener('loadeddata', pronto);
          video.addEventListener('canplay', pronto);
          video.addEventListener('error', falhou);

          pronto();
        });
      }

      async function reproduzir() {
        if (!alvoVisivel) return;

        btnReproduzir.disabled = true;
        limparErro();

        try {
          carregarVideo();

          if (video.readyState < 2 || video.videoWidth === 0) {
            informar('Aguardando o vídeo carregar...');
            await esperarVideo();
          }

          if (!alvoVisivel) return;

          video.muted = false;
          await video.play();

          atualizarTextura();

          await new Promise(resolve => requestAnimationFrame(resolve));
          atualizarTextura();

          plano.setAttribute('visible', true);
          btnReproduzir.textContent = '▶ Reiniciar lembrança';
          btnTentar.style.display = 'none';
          informar('Lembrança reproduzindo!');

        } catch (e) {
          mostrarPainel();
          plano.setAttribute('visible', false);

          informar('Não foi possível iniciar o vídeo com som.');
          mostrarErro(
            'Toque em Reproduzir lembrança para tentar novamente. O navegador pode bloquear a reprodução automática com som.'
          );

          acoes.style.display = 'flex';
          btnReproduzir.style.display = 'block';
          btnTentar.style.display = 'block';

        } finally {
          btnReproduzir.disabled = false;
        }
      }

      btnReproduzir.addEventListener('click', async () => {
        if (!alvoVisivel) {
          informar('Aponte a câmera para a foto primeiro.');
          return;
        }

        if (!video.paused && !video.ended) {
          video.currentTime = 0;
          return;
        }

        autoPlayTentado = true;
        await reproduzir();
      });

      btnTentar.addEventListener('click', async () => {
        limparErro();
        video.pause();
        video.removeAttribute('src');
        video.load();

        carregando = false;
        videoPronto = false;
        autoPlayTentado = false;

        btnTentar.style.display = 'none';
        btnReproduzir.style.display = 'block';
        btnReproduzir.disabled = false;

        carregarVideo();

        try {
          await esperarVideo();

          if (alvoVisivel) {
            videoPronto = true;
            autoPlayTentado = false;
            await tentarReproducaoAutomatica();

            if (video.paused) {
              informar('Vídeo pronto! Toque para reproduzir a lembrança.');
              acoes.style.display = 'flex';
            }
          }
        } catch (e) {
          mostrarPainel();
          informar('Falha ao carregar o vídeo.');
          mostrarErro(e.message);
          acoes.style.display = 'flex';
          btnTentar.style.display = 'block';
        }
      });

      cena.addEventListener('loaded', () => {
        informar('Inicializando câmera. Permita o acesso se solicitado.');
      });

      cena.addEventListener('arReady', () => {
        informar('Uma lembrança especial está esperando por você.\nAponte a câmera para a foto.');
      });

      cena.addEventListener('arError', () => {
        mostrarPainel();
        informar('Não foi possível iniciar a câmera.');
        mostrarErro('Confira a permissão da câmera no navegador.');
      });
    })();
  </script>
</body>
</html>
