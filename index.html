
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>Memória Viva — Foto com vídeo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      background: #171717;
    }

    body {
      overflow: hidden;
    }

    /* Câmera criada pelo MindAR */
    body > video,
    video.mindar-video {
      position: fixed !important;
      display: block !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 0 !important;
      pointer-events: none !important;
    }

    /* Cena AR transparente sobre a câmera */
    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      z-index: 1 !important;
    }

    a-scene canvas,
    a-scene .a-canvas {
      background: transparent !important;
    }

    .top, .bottom {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    .top {
      top: 0;
      padding: calc(14px + env(safe-area-inset-top)) 16px 24px;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.85),
        rgba(0,0,0,.35),
        transparent
      );
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
    }

    .tagline {
      margin-top: 4px;
      color: #ddd;
      font-size: .9rem;
    }

    .instructions {
      margin: 10px auto 0;
      max-width: 440px;
      font-size: .88rem;
      line-height: 1.4;
    }

    .bottom {
      bottom: 0;
      padding: 28px 16px calc(18px + env(safe-area-inset-bottom));
      background: linear-gradient(
        to top,
        rgba(0,0,0,.88),
        rgba(0,0,0,.35),
        transparent
      );
    }

    #status {
      margin: 0 auto 12px;
      max-width: 500px;
      font-size: .9rem;
      line-height: 1.45;
      text-shadow: 0 1px 3px #000;
    }

    #playButton {
      display: none;
      margin: 0 auto;
      padding: 13px 20px;
      border: 0;
      border-radius: 12px;
      background: #1769aa;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      pointer-events: auto;
      cursor: pointer;
    }

    /*
      O vídeo é usado como textura da superfície AR.
      Não deve cobrir a câmera como elemento HTML.
    */
    #memoryVideo {
      position: fixed;
      width: 2px;
      height: 2px;
      left: -10px;
      top: -10px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <header class="top">
    <div class="brand">Memória Viva</div>
    <div class="tagline">Algumas lembranças merecem movimento.</div>
    <div class="instructions">
      Permita o acesso à câmera e aponte para a foto cadastrada.
    </div>
  </header>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: yes;
      uiError: yes;
    "
    embedded
    renderer="alpha: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="20000">
      <video
        id="memoryVideo"
        src="./memoria.mp4"
        preload="auto"
        muted
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="photoTarget"
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#memoryVideo"
        position="0 0 0"
        width="1"
        height="0.5625"
        material="shader: flat; side: double">
      </a-video>

    </a-entity>
  </a-scene>

  <footer class="bottom">
    <div id="status" role="status" aria-live="polite">
      Carregando câmera e vídeo…
    </div>

    <button id="playButton" type="button">
      ▶ Reproduzir lembrança
    </button>
  </footer>

  <script>
    (() => {
      const scene = document.querySelector('a-scene');
      const target = document.querySelector('#photoTarget');
      const video = document.querySelector('#memoryVideo');
      const status = document.querySelector('#status');
      const button = document.querySelector('#playButton');

      let targetVisible = false;
      let videoReady = false;
      let generation = 0;

      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.preload = 'auto';
      video.loop = true;

      function message(text) {
        status.textContent = text;
      }

      function showButton(text) {
        button.textContent = text;
        button.style.display = 'block';
      }

      function hideButton() {
        button.style.display = 'none';
      }

      video.addEventListener('canplay', () => {
        videoReady = true;
        console.log('Vídeo pronto para reprodução.');

        if (!targetVisible) {
          message('Câmera pronta. Aponte para a foto cadastrada.');
        }
      });

      video.addEventListener('error', () => {
        const code = video.error ? video.error.code : 'desconhecido';
        console.error('Erro no vídeo:', code, video.error);

        message(
          'Falha ao carregar o vídeo. Confira memoria.mp4.mp4 no GitHub.'
        );
      });

      async function playMemory() {
        if (!targetVisible) return;

        const currentGeneration = ++generation;

        message('Foto reconhecida! Iniciando vídeo…');

        try {
          // Aguarda o arquivo ficar pronto, sem espera fixa.
          if (!videoReady) {
            await new Promise((resolve, reject) => {
              if (video.readyState >= 3) {
                videoReady = true;
                resolve();
                return;
              }

              const onReady = () => {
                cleanup();
                videoReady = true;
                resolve();
              };

              const onError = () => {
                cleanup();
                reject(new Error('Falha no carregamento do vídeo.'));
              };

              const cleanup = () => {
                video.removeEventListener('canplay', onReady);
                video.removeEventListener('error', onError);
              };

              video.addEventListener('canplay', onReady);
              video.addEventListener('error', onError);
            });
          }

          if (!targetVisible || currentGeneration !== generation) return;

          video.muted = true;
          await video.play();

          if (!targetVisible || currentGeneration !== generation) {
            video.pause();
            return;
          }

          message('Lembrança reproduzindo. Toque para ativar o som.');
          showButton('🔊 Ativar som');
        } catch (error) {
          console.error('Reprodução não iniciada:', error);

          if (!targetVisible || currentGeneration !== generation) return;

          message(
            'Foto reconhecida. Toque no botão para iniciar a lembrança.'
          );
          showButton('▶ Reproduzir lembrança');
        }
      }

      button.addEventListener('click', async () => {
        if (!targetVisible) {
          message('Aponte novamente para a foto cadastrada.');
          return;
        }

        try {
          if (video.paused) {
            video.muted = false;
            video.volume = 1;
            await video.play();
          } else {
            video.muted = false;
            video.volume = 1;
          }

          hideButton();
          message('Lembrança reproduzindo com som.');
        } catch (error) {
          console.error('Falha ao reproduzir com som:', error);

          try {
            video.muted = true;
            await video.play();

            message('Vídeo reproduzindo sem som.');
            showButton('🔊 Tentar ativar som');
          } catch (retryError) {
            message('Não foi possível iniciar. Tente novamente.');
            showButton('▶ Tentar novamente');
          }
        }
      });

      target.addEventListener('targetFound', () => {
        targetVisible = true;
        playMemory();
      });

      target.addEventListener('targetLost', () => {
        targetVisible = false;
        generation++;

        video.pause();

        try {
          video.currentTime = 0;
        } catch (error) {
          console.warn('Não foi possível reiniciar o vídeo.');
        }

        hideButton();
        message('Foto fora de visão. Aponte novamente para a foto.');
      });

      scene.addEventListener('arReady', () => {
        message(
          videoReady
            ? 'Câmera pronta. Aponte para a foto cadastrada.'
            : 'Câmera iniciada. Preparando o vídeo…'
        );
      });

      scene.addEventListener('arError', event => {
        console.error('Erro do MindAR:', event.detail || event);

        message(
          'Erro ao iniciar a câmera ou o reconhecimento. Verifique a permissão da câmera e os arquivos.'
        );
      });

      // Solicita o carregamento do vídeo antecipadamente.
      video.load();
    })();
  </script>
</body>
</html>
