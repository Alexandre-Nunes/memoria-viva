
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Memória Viva</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    #topbar {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      right: 0;
      padding: max(18px, env(safe-area-inset-top)) 16px 18px;
      text-align: center;
      pointer-events: none;
      background: linear-gradient(#000b, transparent);
    }

    #topbar h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    #topbar p {
      margin: 0;
      font-size: 14px;
    }

    #status {
      position: fixed;
      z-index: 20;
      left: 16px;
      right: 16px;
      bottom: max(20px, env(safe-area-inset-bottom));
      padding: 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.82);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
    }

    #startMessage {
      position: fixed;
      z-index: 8;
      top: 50%;
      left: 50%;
      width: calc(100% - 40px);
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      text-shadow: 0 1px 5px black;
      pointer-events: none;
    }

    #startMessage.hidden {
      display: none;
    }

    #playButton {
      display: none;
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: max(90px, calc(env(safe-area-inset-bottom) + 90px));
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 15px 22px;
      border: 0;
      border-radius: 30px;
      background: white;
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #playButton.visible {
      display: block;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    a-scene canvas {
      background: transparent !important;
    }
  </style>
</head>

<body>
  <header id="topbar">
    <h1>Memória Viva</h1>
    <p>Aponte a câmera para a foto e reviva esse momento.</p>
  </header>

  <div id="startMessage">
    Permita o acesso à câmera e aponte para a foto cadastrada.
  </div>

  <div id="status" role="status" aria-live="polite">
    Preparando câmera e vídeo...
  </div>

  <button id="playButton" type="button">
    ▶ Reproduzir vídeo
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets timeout="15000">
      <video
        id="memoryVideo"
        src="./memoria.mp4.mp4"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
        loop
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-entity id="imageTarget" mindar-image-target="targetIndex: 0">
      <a-video
        id="videoPlane"
        src="#memoryVideo"
        width="1"
        height="0.5625"
        position="0 0 0.01"
        material="shader: flat"
      ></a-video>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script>
    (() => {
      const scene = document.querySelector("a-scene");
      const target = document.querySelector("#imageTarget");
      const video = document.querySelector("#memoryVideo");
      const plane = document.querySelector("#videoPlane");
      const status = document.querySelector("#status");
      const button = document.querySelector("#playButton");
      const startMessage = document.querySelector("#startMessage");

      let targetVisible = false;
      let videoReady = false;

      function message(text) {
        status.textContent = text;
      }

      function showButton(show) {
        button.classList.toggle("visible", show);
      }

      function updateVideoSize() {
        if (!video.videoWidth || !video.videoHeight) return;

        const ratio = video.videoWidth / video.videoHeight;
        plane.setAttribute("width", 1);
        plane.setAttribute("height", 1 / ratio);
      }

      function waitForVideo() {
        return new Promise((resolve, reject) => {
          if (video.readyState >= 2) {
            resolve();
            return;
          }

          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("O vídeo demorou demais para carregar."));
          }, 20000);

          function cleanup() {
            clearTimeout(timeout);
            video.removeEventListener("canplay", onReady);
            video.removeEventListener("error", onError);
          }

          function onReady() {
            cleanup();
            resolve();
          }

          function onError() {
            cleanup();
            reject(new Error("Não foi possível carregar o arquivo de vídeo."));
          }

          video.addEventListener("canplay", onReady);
          video.addEventListener("error", onError);
          video.load();
        });
      }

      async function startVideo(withSound = false) {
        if (!targetVisible) return;

        try {
          message("Foto reconhecida! Carregando o vídeo...");
          showButton(false);

          await waitForVideo();

          updateVideoSize();

          video.muted = !withSound;

          await video.play();

          videoReady = true;
          message(
            withSound
              ? "Vídeo reproduzindo com som."
              : "Vídeo reproduzindo. Toque em ativar som se desejar."
          );

          if (!withSound) {
            button.textContent = "🔊 Ativar som";
            showButton(true);
          }
        } catch (error) {
          console.error("Erro na reprodução:", error);
          console.error("Código do erro de vídeo:", video.error);
          console.error("Arquivo solicitado:", video.currentSrc);
          console.error("Estado de carregamento:", video.readyState);

          if (error.name === "NotAllowedError") {
            message("O navegador bloqueou a reprodução automática. Toque no botão.");
            button.textContent = "▶ Reproduzir vídeo";
            showButton(true);
          } else if (video.error) {
            const errorCode = video.error.code;
            const details = {
              1: "carregamento interrompido",
              2: "falha de rede",
              3: "formato ou codificação incompatível",
              4: "arquivo não encontrado ou formato não suportado"
            };

            message(
              "Falha no vídeo: " +
              (details[errorCode] || "erro desconhecido") +
              ". Confira o arquivo memoria.mp4.mp4."
            );
            button.textContent = "↻ Tentar novamente";
            showButton(true);
          } else {
            message("Não foi possível iniciar o vídeo. Toque para tentar novamente.");
            button.textContent = "▶ Tentar reproduzir";
            showButton(true);
          }
        }
      }

      video.addEventListener("loadedmetadata", updateVideoSize);
      video.addEventListener("canplay", () => {
        videoReady = true;
        updateVideoSize();
      });

      video.addEventListener("playing", () => {
        if (targetVisible) {
          message(video.muted
            ? "Vídeo reproduzindo sem som."
            : "Vídeo reproduzindo com som.");
        }
      });

      target.addEventListener("targetFound", () => {
        targetVisible = true;
        startMessage.classList.add("hidden");
        message("Foto reconhecida! Iniciando o vídeo...");
        startVideo(false);
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;
        video.pause();
        showButton(false);
        startMessage.classList.remove("hidden");
        message("Foto fora de visão. Aponte novamente para a foto.");
      });

      button.addEventListener("click", () => {
        if (!targetVisible) {
          message("Aponte a câmera para a foto primeiro.");
          return;
        }

        // O toque inicia o vídeo e tenta liberar o som.
        startVideo(true);
      });

      scene.addEventListener("arReady", () => {
        message("Câmera pronta! Aponte para a foto cadastrada.");
      });

      scene.addEventListener("arError", (event) => {
        console.error("Erro da câmera/realidade aumentada:", event);
        message("Erro ao iniciar a câmera. Confira a permissão do navegador.");
      });

      video.addEventListener("error", () => {
        console.error("Erro de vídeo:", video.error);
        console.error("URL do vídeo:", video.currentSrc);
      });
    })();
  </script>
</body>
</html>
