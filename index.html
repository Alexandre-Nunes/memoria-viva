
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>Memória Viva — Foto com vídeo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      background: transparent !important;
    }

    body {
      position: relative;
      isolation: isolate;
    }

    /*
      CÂMERA:
      O MindAR cria este vídeo durante a inicialização.
      Não esconder nem colocar a câmera atrás de um fundo opaco.
    */
    body > video,
    video.mindar-video {
      position: fixed !important;
      display: block !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: none !important;
    }

    /*
      CENA AR:
      Ocupa a tela inteira e mantém o canvas transparente.
    */
    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    a-scene canvas,
    a-scene .a-canvas {
      background: transparent !important;
    }

    /*
      Interface acima da câmera, sem bloquear a região central.
    */
    .interface {
      position: fixed;
      z-index: 10;
      left: 0;
      right: 0;
      pointer-events: none;
    }

    .top {
      top: 0;
      padding: calc(12px + env(safe-area-inset-top)) 16px 14px;
      text-align: center;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, .82),
        rgba(0, 0, 0, .48),
        transparent
      );
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .tagline {
      margin-top: 4px;
      color: #e0e0e0;
      font-size: .9rem;
    }

    .instructions {
      margin: 10px auto 0;
      max-width: 440px;
      color: #fff;
      font-size: .88rem;
      line-height: 1.4;
    }

    .bottom {
      bottom: 0;
      padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
      text-align: center;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, .88),
        rgba(0, 0, 0, .45),
        transparent
      );
    }

    #status {
      margin: 0 auto 10px;
      max-width: 520px;
      font-size: .9rem;
      line-height: 1.4;
      text-shadow: 0 1px 3px #000;
    }

    #playButton {
      display: none;
      margin: 0 auto;
      padding: 13px 20px;
      border: 0;
      border-radius: 12px;
      background: #1769aa;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    #playButton:active {
      opacity: .8;
    }

    /*
      O vídeo usado como textura não deve aparecer como
      elemento HTML sobre a câmera.
    */
    #memoryVideo {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /*
      Desativa apenas a interface de carregamento do MindAR.
      A câmera e o reconhecimento continuam ativos.
    */
    .mindar-ui-overlay,
    .mindar-ui-loading {
      pointer-events: none !important;
    }
  </style>
</head>

<body>

  <!-- Interface superior -->
  <header class="interface top">
    <div class="brand">Memória Viva</div>
    <div class="tagline">Algumas lembranças merecem movimento.</div>
    <div class="instructions">
      Aponte a câmera para a foto cadastrada.
      A lembrança aparecerá automaticamente.
    </div>
  </header>

  <!-- Realidade aumentada em tela cheia -->
  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: yes;
      uiError: yes;
    "
    embedded
    color-space="sRGB"
    renderer="alpha: true, colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="15000">
      <video
        id="memoryVideo"
        src="./memoria.mp4.mp4"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="photoTarget"
      mindar-image-target="targetIndex: 0">

      <a-video
        id="memoryPlane"
        src="#memoryVideo"
        position="0 0 0"
        width="1"
        height="0.5625"
        material="shader: flat; side: double">
      </a-video>

    </a-entity>
  </a-scene>

  <!-- Interface inferior -->
  <footer class="interface bottom">
    <div id="status" role="status" aria-live="polite">
      Preparando a câmera e carregando a lembrança…
    </div>

    <button id="playButton" type="button">
      ▶ Reproduzir lembrança
    </button>
  </footer>

  <script>
    (() => {
      const scene = document.querySelector('a-scene');
      const target = document.querySelector('#photoTarget');
      const video = document.querySelector('#memoryVideo');
      const status = document.querySelector('#status');
      const playButton = document.querySelector('#playButton');

      let targetVisible = false;
      let arReady = false;
      let videoReady = false;
      let playRequest = 0;

      // Preparar o vídeo antes do reconhecimento da foto.
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.loop = true;
      video.preload = 'auto';

      function setStatus(message) {
        status.textContent = message;
      }

      function showPlayButton(message) {
        playButton.textContent = message;
        playButton.style.display = 'block';
      }

      function hidePlayButton() {
        playButton.style.display = 'none';
      }

      function waitForVideo() {
        if (video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
          videoReady = true;
          return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
          function cleanup() {
            video.removeEventListener('canplay', onReady);
            video.removeEventListener('error', onError);
          }

          function onReady() {
            cleanup();
            videoReady = true;
            resolve();
          }

          function onError() {
            cleanup();
            reject(new Error('O arquivo de vídeo não pôde ser carregado.'));
          }

          video.addEventListener('canplay', onReady, { once: true });
          video.addEventListener('error', onError, { once: true });

          // Verificação adicional caso o carregamento termine
          // entre a primeira verificação e o registro dos eventos.
          if (video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
            cleanup();
            videoReady = true;
            resolve();
          }
        });
      }

      async function startMemory() {
        if (!targetVisible) return;

        const request = ++playRequest;

        setStatus('Foto reconhecida! Preparando o vídeo…');

        try {
          // Espera os dados do vídeo, não apenas seus metadados.
          if (!videoReady) {
            await waitForVideo();
          }

          // A foto pode ter saído de visão durante o carregamento.
          if (!targetVisible || request !== playRequest) return;

          // Silencioso para permitir autoplay nos navegadores móveis.
          video.muted = true;
          video.currentTime = 0;

          await video.play();

          if (!targetVisible || request !== playRequest) {
            video.pause();
            return;
          }

          setStatus('Lembrança reproduzindo! Toque para ativar o som.');
          showPlayButton('🔊 Ativar som');
        } catch (error) {
          console.error('Erro ao iniciar lembrança:', error);

          if (!targetVisible || request !== playRequest) return;

          setStatus(
            'Foto reconhecida. Toque no botão para iniciar a lembrança.'
          );

          showPlayButton('▶ Reproduzir lembrança');
        }
      }

      // Um único botão serve para iniciar o vídeo ou ativar o áudio.
      playButton.addEventListener('click', async () => {
        if (!targetVisible) {
          setStatus('Aponte novamente para a foto cadastrada.');
          return;
        }

        try {
          if (video.paused) {
            video.muted = false;
            video.volume = 1;
            await video.play();
          } else {
            video.muted = false;
            video.volume = 1;
          }

          hidePlayButton();
          setStatus('Lembrança reproduzindo com som!');
        } catch (error) {
          console.error('Erro na reprodução com som:', error);

          // A reprodução silenciosa continua sendo uma alternativa.
          try {
            video.muted = true;
            await video.play();

            setStatus('Vídeo reproduzindo sem som. Tente ativar o áudio.');
            showPlayButton('🔊 Tentar ativar som');
          } catch (fallbackError) {
            setStatus('Não foi possível iniciar. Toque para tentar novamente.');
            showPlayButton('▶ Tentar novamente');
          }
        }
      });

      target.addEventListener('targetFound', () => {
        targetVisible = true;
        startMemory();
      });

      target.addEventListener('targetLost', () => {
        targetVisible = false;
        playRequest++;

        video.pause();

        // Recomeça do início quando a foto for encontrada novamente.
        try {
          video.currentTime = 0;
        } catch (error) {
          console.warn('Não foi possível reiniciar a posição do vídeo.');
        }

        hidePlayButton();
        setStatus('Foto fora de visão. Aponte novamente para a foto.');
      });

      scene.addEventListener('arReady', () => {
        arReady = true;

        if (!targetVisible) {
          setStatus(
            videoReady
              ? 'Câmera pronta. Aponte para a foto cadastrada.'
              : 'Câmera pronta. Finalizando carregamento do vídeo…'
          );
        }
      });

      scene.addEventListener('arError', (event) => {
        console.error('Erro ao iniciar a câmera:', event.detail || event);

        setStatus(
          'Não foi possível iniciar a câmera. Verifique a permissão do navegador e recarregue a página.'
        );
      });

      video.addEventListener('canplay', () => {
        videoReady = true;

        if (arReady && !targetVisible) {
          setStatus('Câmera pronta. Aponte para a foto cadastrada.');
        }
      });

      video.addEventListener('error', () => {
        videoReady = false;

        console.error('Falha no vídeo:', video.error);

        setStatus(
          'Erro ao carregar memoria.mp4.mp4. Confira o nome e o arquivo no GitHub.'
        );
      });

      // Inicia o pré-carregamento o quanto antes.
      video.load();
    })();
  </script>
</body>
</html>
