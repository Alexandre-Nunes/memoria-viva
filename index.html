
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <title>Memória Viva</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
    }

    /* O vídeo não pode aparecer como um segundo elemento HTML. */
    #memoryVideo {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -10px;
      top: 0;
      opacity: 0;
      pointer-events: none;
    }

    #painel {
      position: fixed;
      z-index: 1000;
      top: env(safe-area-inset-top, 12px);
      left: 12px;
      right: 12px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.82);
      color: white;
      text-align: center;
    }

    #titulo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    #status {
      font-size: 14px;
      line-height: 1.4;
    }

    #acoes {
      display: none;
      margin-top: 12px;
      gap: 8px;
      flex-direction: column;
    }

    button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 9px;
      padding: 12px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.55;
    }

    #diagnostico {
      display: none;
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.4;
      color: #ffd7d7;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div id="painel">
    <div id="titulo">Memória Viva</div>
    <div id="status">Preparando a realidade aumentada...</div>

    <div id="acoes">
      <button id="btnReproduzir">▶ Reproduzir lembrança</button>
      <button id="btnSom" style="display:none;">🔊 Ativar som</button>
      <button id="btnTentarNovamente" style="display:none;">
        Tentar carregar novamente
      </button>
    </div>

    <div id="diagnostico"></div>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets>
      <!-- Único elemento de vídeo; sem endereço até a foto ser reconhecida. -->
      <video
        id="memoryVideo"
        playsinline
        webkit-playsinline
        muted
        loop
        preload="none"
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="alvo"
      mindar-image-target="targetIndex: 0"
    >
      <a-video
        id="videoPlane"
        src="#memoryVideo"
        width="1"
        height="0.5625"
        position="0 0 0.02"
        rotation="0 0 0"
        material="shader: flat; side: double"
        visible="false"
      ></a-video>
    </a-entity>

  </a-scene>

  <script>
    (() => {
      const video = document.getElementById('memoryVideo');
      const alvo = document.getElementById('alvo');
      const plano = document.getElementById('videoPlane');

      const status = document.getElementById('status');
      const acoes = document.getElementById('acoes');
      const diagnostico = document.getElementById('diagnostico');

      const btnReproduzir = document.getElementById('btnReproduzir');
      const btnSom = document.getElementById('btnSom');
      const btnTentar = document.getElementById('btnTentarNovamente');

      let alvoVisivel = false;
      let carregamentoSolicitado = false;

      function mostrarStatus(mensagem) {
        status.textContent = mensagem;
      }

      function mostrarErro(mensagem) {
        diagnostico.textContent = mensagem;
        diagnostico.style.display = 'block';
      }

      function esconderErro() {
        diagnostico.textContent = '';
        diagnostico.style.display = 'none';
      }

      function carregarVideo() {
        if (!alvoVisivel || carregamentoSolicitado) return;

        carregamentoSolicitado = true;
        esconderErro();
        mostrarStatus('Carregando o vídeo da lembrança...');

        video.src = new URL(
          './memoria.mp4.mp4',
          window.location.href
        ).href;

        video.load();
      }

      video.addEventListener('loadeddata', () => {
        if (!alvoVisivel) return;

        mostrarStatus('Vídeo carregado. Toque em Reproduzir lembrança.');
      });

      video.addEventListener('canplay', () => {
        if (alvoVisivel && video.paused) {
          mostrarStatus('Pronto! Toque em Reproduzir lembrança.');
        }
      });

      video.addEventListener('playing', () => {
        esconderErro();

        if (alvoVisivel) {
          mostrarStatus('Lembrança reproduzindo!');
          btnReproduzir.textContent = '▶ Reiniciar lembrança';
          btnSom.style.display = video.muted ? 'block' : 'none';
        }
      });

      video.addEventListener('error', () => {
        carregamentoSolicitado = false;

        if (!alvoVisivel) return;

        let detalhe = 'Erro desconhecido ao carregar o vídeo.';

        if (video.error) {
          switch (video.error.code) {
            case 1:
              detalhe = 'O carregamento foi interrompido.';
              break;
            case 2:
              detalhe = 'Falha de rede ao baixar o vídeo.';
              break;
            case 3:
              detalhe = 'O navegador não conseguiu decodificar o vídeo.';
              break;
            case 4:
              detalhe = 'Formato ou endereço do vídeo não reconhecido.';
              break;
          }
        }

        mostrarStatus('Falha ao carregar o vídeo.');
        mostrarErro(
          detalhe + ' Arquivo esperado: memoria.mp4.mp4'
        );
        btnTentar.style.display = 'block';
      });

      alvo.addEventListener('targetFound', () => {
        alvoVisivel = true;
        acoes.style.display = 'flex';
        btnReproduzir.disabled = false;
        btnReproduzir.textContent = '▶ Reproduzir lembrança';
        esconderErro();

        mostrarStatus('Foto reconhecida! Preparando o vídeo...');
        carregarVideo();
      });

      alvo.addEventListener('targetLost', () => {
        alvoVisivel = false;
        acoes.style.display = 'none';
        plano.setAttribute('visible', false);

        video.pause();
        btnSom.style.display = 'none';
        btnTentar.style.display = 'none';

        mostrarStatus('Foto fora de visão. Aponte novamente para a foto.');
      });

      function aguardarVideo() {
        return new Promise((resolve, reject) => {
          if (video.readyState >= 2) {
            resolve();
            return;
          }

          let finalizado = false;

          const limpar = () => {
            clearTimeout(temporizador);
            video.removeEventListener('canplay', pronto);
            video.removeEventListener('error', falhou);
          };

          const concluir = (funcao, valor) => {
            if (finalizado) return;
            finalizado = true;
            limpar();
            funcao(valor);
          };

          const pronto = () => concluir(resolve);
          const falhou = () => concluir(
            reject,
            new Error('O navegador não conseguiu carregar os dados do vídeo.')
          );

          const temporizador = setTimeout(() => {
            concluir(
              reject,
              new Error('O vídeo demorou mais de 15 segundos para carregar.')
            );
          }, 15000);

          video.addEventListener('canplay', pronto);
          video.addEventListener('error', falhou);
        });
      }

      async function reproduzir() {
        btnReproduzir.disabled = true;
        esconderErro();

        try {
          if (!video.src) {
            carregarVideo();
          }

          if (video.readyState < 2) {
            mostrarStatus('Aguardando o vídeo carregar...');
            await aguardarVideo();
          }

          video.muted = true;

          await video.play();

          // Mostra somente a superfície 3D quando a reprodução começou.
          plano.setAttribute('visible', true);

          const material = plano.components &&
            plano.components.material &&
            plano.components.material.material;

          if (material && material.map) {
            material.map.needsUpdate = true;
          }

          mostrarStatus('Lembrança reproduzindo!');
          btnReproduzir.textContent = '▶ Reiniciar lembrança';
          btnSom.style.display = 'block';
          btnTentar.style.display = 'none';

        } catch (erro) {
          plano.setAttribute('visible', false);
          mostrarStatus('Não foi possível reproduzir o vídeo.');
          mostrarErro(erro.message || 'Erro ao iniciar a reprodução.');
          btnTentar.style.display = 'block';
        } finally {
          btnReproduzir.disabled = false;
        }
      }

      btnReproduzir.addEventListener('click', async () => {
        if (!alvoVisivel) {
          mostrarStatus('Aponte a câmera para a foto primeiro.');
          return;
        }

        if (!video.paused && !video.ended) {
          video.currentTime = 0;
          return;
        }

        await reproduzir();
      });

      btnSom.addEventListener('click', async () => {
        try {
          video.muted = false;
          await video.play();
          btnSom.style.display = 'none';
          mostrarStatus('Lembrança reproduzindo com som!');
        } catch (erro) {
          video.muted = true;
          mostrarStatus('Não foi possível ativar o som.');
          mostrarErro(erro.message || 'O navegador bloqueou o áudio.');
        }
      });

      btnTentar.addEventListener('click', async () => {
        carregamentoSolicitado = false;
        esconderErro();

        video.pause();
        video.removeAttribute('src');
        video.load();

        carregarVideo();

        if (alvoVisivel) {
          await reproduzir();
        }
      });

      document.querySelector('a-scene').addEventListener('loaded', () => {
        mostrarStatus('Câmera preparada. Aponte para a foto do fotolivro.');
      });

      document.querySelector('a-scene').addEventListener('arReady', () => {
        mostrarStatus('Câmera pronta. Aponte para a foto do fotolivro.');
      });
    })();
  </script>

</body>
</html>
